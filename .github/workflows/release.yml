name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: printf '%s' "${{ secrets.KEYSTORE_B64 }}" | base64 -d > blackboxreborn.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/blackboxreborn.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/BlackBoxReborn-${{ steps.version.outputs.VERSION }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: BlackBox Reborn ${{ steps.version.outputs.VERSION }}
          body: |
            See [CHANGELOG.md](https://github.com/fdavids77/BlackBoxReborn/blob/main/CHANGELOG.md) for what changed.

            **Fixes included:** PackageParserFix · ArtMethodFix · GMS signature passthrough · NativeCore UID spoof
          files: app/build/outputs/apk/release/BlackBoxReborn-${{ steps.version.outputs.VERSION }}.apk
